services:

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d notes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build: ./
    depends_on:
      - db
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
volumes:
  db_data:
  